name: Chigetang Agent CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Prepare media tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Prepare media tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node --input-type=module -e "const { prepareRuntime } = await import('./scripts/prepare-windows-runtime.mjs'); await prepareRuntime({ only: 'ff' });"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Join-Path $env:GITHUB_WORKSPACE 'resources' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify media tools on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe.exe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm test

  build-ui:
    name: Build and UI regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
      - run: npm run test:bundle